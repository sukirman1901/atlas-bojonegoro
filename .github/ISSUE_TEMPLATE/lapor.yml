name: Lapor isu
description: Laporkan isu publik di Kabupaten Bojonegoro. Bukan kanal darurat.
title: "[Lapor] "
labels: ["lapor"]
body:
  - type: markdown
    attributes:
      value: |
        Isi ringkas dan dapat dicek. Lampirkan tautan bukti bila ada.
        Laporan masuk antrian sampai redaksi menaikkan menjadi isu.
  - type: dropdown
    id: kecamatan
    attributes:
      label: Kecamatan
      options:
        - Balen
        - Baureno
        - Bojonegoro
        - Bubulan
        - Dander
        - Gayam
        - Gondang
        - Kalitidu
        - Kanor
        - Kapas
        - Kasiman
        - Kedewan
        - Kedungadem
        - Kepohbaru
        - Malo
        - Margomulyo
        - Ngambon
        - Ngasem
        - Ngraho
        - Padangan
        - Purwosari
        - Sekar
        - Sugihwaras
        - Sukosewu
        - Sumberrejo
        - Tambakrejo
        - Temayang
        - Trucuk
    validations:
      required: true
  - type: dropdown
    id: kategori
    attributes:
      label: Kategori
      options:
        - Hukum & Korupsi
        - Pemerintahan
        - Infrastruktur & Energi
        - Sosial & Kesehatan
        - Ekonomi & Pangan
        - Bencana & Lingkungan
        - Kamtibmas & Laka
        - Agenda & Prestasi
    validations:
      required: true
  - type: textarea
    id: uraian
    attributes:
      label: Uraian
      description: Apa yang terjadi, di mana, kapan, siapa yang terlibat.
      placeholder: Minimal beberapa kalimat yang bisa diverifikasi.
    validations:
      required: true
  - type: input
    id: url_bukti
    attributes:
      label: Tautan bukti
      description: Opsional. URL http(s) ke berita, unggahan, atau dokumen.
      placeholder: https://
  - type: checkboxes
    id: bukan_darurat
    attributes:
      label: Bukan darurat
      options:
        - label: Ini bukan laporan polisi atau keadaan darurat.
          required: true
